name: Code Quality
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Run tests and quality checks
        run: ./gradlew clean check

      - name: Upload test results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: 'test-results'
          path: |
            build/reports/
            build/test-results/
