spring:
  application:
    name: app
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/resources
      - classpath:db/migration/booking
      - classpath:db/migration/payments
      - classpath:db/migration/notifications
      - classpath:db/migration/auth
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

jwt:
  expiration-ms: 86400000

app:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_mock}
