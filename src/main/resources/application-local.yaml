spring:
  application:
    name: app
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/resources
      - classpath:db/migration/booking
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  datasource:
    url: jdbc:postgresql://localhost:5432/booking
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
